name: Secure Guard V1 dedicated DB integration checks

on:
  pull_request:
    branches:
      - feature/secure-guard-daily-management
      - feat/sg-v1-dedicated-integration-20261112
      - feat/secure-guard-mfa-v1-20261127
      - feat/secure-guard-mfa-m2-20261127
      - feat/secure-guard-mfa-m3-20261127
    paths:
      - 'src/**'
      - 'test/**'
      - 'migrations/secure_guard/**'
      - 'migrations/secure_guard_runner.ts'
      - 'migration-runtime/**'
      - 'migration-manifests/secure-guard-staging-001-005.json'
      - 'Dockerfile'
      - 'Dockerfile.secure-guard-migration'
      - 'scripts/readiness/verifySecureGuardMigrationManifest.cjs'
      - 'package.json'
      - 'tsconfig.secure-guard-migration.json'
      - '.github/workflows/secure-guard-v1-integration.yml'
  push:
    branches:
      - feat/sg-v1-dedicated-integration-20261112
      - feat/secure-guard-mfa-v1-20261127
      - feat/secure-guard-mfa-m2-20261127
      - feat/secure-guard-mfa-m3-20261127
      - chore/secure-guard-node24-release-candidate-20261128

permissions:
  contents: read

jobs:
  isolated-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local_ci_fixture_password_not_a_secret
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install locked dependencies
        run: npm ci
      - name: Offline regression suite
        run: npm test
      - name: Dedicated SG migration typecheck
        run: npm run typecheck:secure-guard-migration
      - name: Build dedicated SG migration image
        run: >-
          docker build --file Dockerfile.secure-guard-migration
          --build-arg SOURCE_REVISION=${{ github.sha }}
          --tag secure-guard-migration-ci:current .
      - name: Isolated PG16 migration and role-boundary acceptance
        run: npm run test:secure-guard-db-e2e
        env:
          CI: 'true'
          NODE_ENV: 'test'
          SECURE_GUARD_DB_E2E_ENABLED: 'true'
          SECURE_GUARD_DB_E2E_HOST: '127.0.0.1'
          SECURE_GUARD_DB_E2E_PORT: '55432'
      - name: Dedicated migration image startup and replay acceptance
        run: npm run test:secure-guard-migration-image-e2e
        env:
          CI: 'true'
          SECURE_GUARD_MIGRATION_IMAGE_E2E_ENABLED: 'true'
      - name: Build current application image (no new service or Dockerfile)
        run: >-
          docker build --file Dockerfile
          --tag secure-guard-app-ci:${{ github.sha }} .
      - name: Verify supported app container runtime
        shell: bash
        run: |
          set -euo pipefail
          version="$(docker run --rm --entrypoint node secure-guard-app-ci:${{ github.sha }} -p 'process.versions.node')"
          [[ "$version" == 24.* ]] || {
            echo "STOP: App runtime is not Node 24 LTS"
            exit 1
          }
          echo "NODE_APP_RUNTIME=24_LTS_PASS"
      - name: Smoke current application image with isolated Secure Guard Staging profile
        shell: bash
        run: |
          set -euo pipefail
          name="secure-guard-isolated-smoke-${{ github.run_id }}"
          cleanup() { docker rm -f "$name" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          docker run --detach --name "$name" \
            --publish 127.0.0.1:18080:8080 \
            --env NODE_ENV=production \
            --env SECURE_GUARD_STAGING_ISOLATED=true \
            --env SECURE_GUARD_DB_MODE=dedicated \
            --env SECURE_GUARD_DB_REQUIRE_DEDICATED=true \
            --env SECURE_GUARD_DB_NAME=secure_guard_staging \
            --env SECURE_GUARD_DB_HOST=127.0.0.1 \
            --env SECURE_GUARD_DB_USER=secure_guard_runtime_staging \
            --env SECURE_GUARD_DB_PASSWORD=synthetic-ci-no-real-db \
            --env SECURE_GUARD_JWT_SECRET=synthetic-ci-only-session-key-not-for-deployment \
            --env SECURE_GUARD_BASE_URL=https://secure-guard.example.test/ \
            secure-guard-app-ci:${{ github.sha }} >/dev/null

          ready=0
          for i in {1..30}; do
            if [[ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/healthz || true)" == "200" ]]; then
              ready=1
              break
            fi
            sleep 1
          done
          if [[ "$ready" != "1" ]]; then
            docker logs "$name" | tail -n 60
            exit 1
          fi
          expect_status() {
            local want="$1" path="$2" method="${3:-GET}"
            local actual
            actual="$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 -X "$method" "http://127.0.0.1:18080$path")"
            if [[ "$actual" != "$want" ]]; then
              echo "FAIL: $method $path expected=$want actual=$actual"
              exit 1
            fi
          }
          expect_status 200 /secure-guard-login.html
          expect_status 200 /css/style.css
          expect_status 200 /js/secureGuard.js
          expect_status 200 /js/secureGuardHome.js
          expect_status 200 /js/secureGuardAdmin.js
          expect_status 404 /js/api.js
          expect_status 404 /secure-guard-accept.html
          expect_status 404 /login.html
          expect_status 404 /api/hosts
          expect_status 401 /api/secure-guard/me
          expect_status 503 /api/secure-guard/auth/invitations/accept POST
          expect_status 503 /api/secure-guard/agents/00000000-0000-4000-8000-000000000000/queued-uninstall POST
          expect_status 503 /api/secure-guard/admin/dnsfilter/organizations POST
          echo "PASS: existing image, isolated Secure Guard, legacy routes absent, mutations denied"

      # Security scan is on the built application image, not just package-lock.
      # Never push any image or access GCP/Cloud SQL/Production.
      - name: Trivy app image security report (Critical / High)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0, signed immutable release
        with:
          scan-type: image
          image-ref: secure-guard-app-ci:${{ github.sha }}
          format: json
          output: secure-guard-app-image-vulnerabilities.json
          severity: CRITICAL,HIGH
          vuln-type: os,library
          scanners: vuln
          ignore-unfixed: 'false'
          exit-code: '0'

      - name: Keep scanner evidence for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secure-guard-app-image-security-${{ github.run_id }}
          path: secure-guard-app-image-vulnerabilities.json
          if-no-files-found: warn
          retention-days: 14

      - name: Enforce candidate application image security gate
        shell: bash
        run: |
          set -euo pipefail
          [[ -s secure-guard-app-image-vulnerabilities.json ]] || {
            echo "APP_IMAGE_SECURITY_GATE=STOP_REPORT_MISSING"
            exit 1
          }
          jq -e 'type == "object" and (.Results | type == "array")' \
            secure-guard-app-image-vulnerabilities.json >/dev/null || {
              echo "APP_IMAGE_SECURITY_GATE=STOP_REPORT_INVALID"
              exit 1
            }
          critical="$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "CRITICAL")] | length' secure-guard-app-image-vulnerabilities.json)"
          high="$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "HIGH")] | length' secure-guard-app-image-vulnerabilities.json)"
          echo "APP_IMAGE_CRITICAL=$critical APP_IMAGE_HIGH=$high"
          echo "=== Candidate image Critical/High findings (severity, CVE, package, installed, fixed, class, target) ==="
          jq -r '
            .Results[]?
            | (.Target // "unknown") as $target
            | (.Type // "unknown") as $class
            | .Vulnerabilities[]?
            | select(.Severity == "CRITICAL" or .Severity == "HIGH")
            | [ .Severity, .VulnerabilityID, .PkgName,
                .InstalledVersion, (.FixedVersion // "UNFIXED"),
                $class, $target ] | @tsv
          ' secure-guard-app-image-vulnerabilities.json
          if [[ "$critical" != "0" || "$high" != "0" ]]; then
            echo "APP_IMAGE_SECURITY_GATE=STOP"
            exit 1
          fi
          echo "APP_IMAGE_SECURITY_GATE=CI_PASS_GCP_SCAN_STILL_REQUIRED"
