name: Secure Guard V1 dedicated DB integration checks

on:
  pull_request:
    branches:
      - feature/secure-guard-daily-management
    paths:
      - 'src/**'
      - 'test/**'
      - 'migrations/secure_guard/**'
      - 'migrations/secure_guard_runner.ts'
      - 'package.json'
      - 'tsconfig.secure-guard-migration.json'
      - '.github/workflows/secure-guard-v1-integration.yml'
  push:
    branches:
      - feat/sg-v1-dedicated-integration-20261112

permissions:
  contents: read

jobs:
  isolated-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local_ci_fixture_password_not_a_secret
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install locked dependencies
        run: npm ci
      - name: Offline regression suite
        run: npm test
      - name: Dedicated SG migration typecheck
        run: npm run typecheck:secure-guard-migration
      - name: Isolated PG16 migration and role-boundary acceptance
        run: npm run test:secure-guard-db-e2e
        env:
          CI: 'true'
          NODE_ENV: 'test'
          SECURE_GUARD_DB_E2E_ENABLED: 'true'
          SECURE_GUARD_DB_E2E_HOST: '127.0.0.1'
          SECURE_GUARD_DB_E2E_PORT: '55432'
