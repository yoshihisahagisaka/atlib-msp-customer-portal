<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>トポロジー | atLIB InfraVision ポータル</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="/css/style.css">
<script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
<style>
  #topology-map {
    height: 600px;
    border: 1px solid var(--color-border);
    border-radius: 4px;
  }
  .topo-status {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 0.85rem;
    color: var(--color-muted);
    margin-bottom: 0.75rem;
  }
  .legend {
    display: flex;
    flex-wrap: wrap;
    gap: 1rem;
    font-size: 0.85rem;
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 0.4rem;
  }
  .legend-dot {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    display: inline-block;
  }
  .legend-fault {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    display: inline-block;
    background: #fff;
    border: 3px solid #d32f2f;
  }
  select.role-select {
    width: auto;
    padding: 0.3rem 0.5rem;
    font-size: 0.85rem;
  }
  .problem-list {
    margin: 0;
    padding-left: 1.1rem;
    font-size: 0.8rem;
    color: var(--color-danger);
  }
</style>
</head>
<body>
<nav class="app-nav" id="app-nav"></nav>

<div class="page">
  <h1>トポロジー</h1>

  <div class="card">
    <div class="topo-status">
      <span id="topo-updated">読み込み中...</span>
      <span>🔄 30秒ごとに自動更新</span>
    </div>
    <div id="topology-map"></div>
    <div class="legend" style="margin-top:1rem;">
      <span class="legend-item"><span class="legend-dot" style="background:#1a237e;"></span>ルーター</span>
      <span class="legend-item"><span class="legend-dot" style="background:#f57c00;"></span>スイッチ</span>
      <span class="legend-item"><span class="legend-dot" style="background:#0288d1;"></span>AP</span>
      <span class="legend-item"><span class="legend-dot" style="background:#7b1fa2;"></span>プリンター</span>
      <span class="legend-item"><span class="legend-dot" style="background:#26a69a;"></span>その他</span>
      <span class="legend-item"><span class="legend-fault"></span>障害発生中</span>
    </div>
  </div>

  <div class="card">
    <h2>機器一覧・役割設定</h2>
    <p class="info-message">図の表示色は役割の設定から変更できます（この端末のブラウザにのみ保存されます）。</p>
    <table>
      <thead>
        <tr><th>名称</th><th>IPアドレス</th><th>役割</th><th>状態</th></tr>
      </thead>
      <tbody id="topo-host-list"></tbody>
    </table>
    <p id="no-topo-host-message" class="info-message" style="display:none;">表示できる機器がありません。</p>
  </div>
</div>

<script src="/js/api.js"></script>
<script>
const ROLE_STYLE = {
  router:  { background: '#1a237e', border: '#0d1b3e', size: 20 },
  switch:  { background: '#f57c00', border: '#e65100', size: 17 },
  ap:      { background: '#0288d1', border: '#01579b', size: 15 },
  printer: { background: '#7b1fa2', border: '#4a148c', size: 13 },
  other:   { background: '#26a69a', border: '#004d40', size: 13 },
};
const ROLE_LABELS = { router: 'ルーター', switch: 'スイッチ', ap: 'AP', printer: 'プリンター', other: 'その他' };
const FAULT_BORDER = '#d32f2f';
const REFRESH_INTERVAL_MS = 30000;

function roleKey(hostId) {
  return `topo-role-${hostId}`;
}

function getRole(hostId) {
  return localStorage.getItem(roleKey(hostId)) || 'other';
}

function setRole(hostId, role) {
  localStorage.setItem(roleKey(hostId), role);
}

function escapeHtml(s) {
  const div = document.createElement('div');
  div.textContent = s;
  return div.innerHTML;
}

let network = null;
const nodesDataSet = new vis.DataSet([]);
const edgesDataSet = new vis.DataSet([]);
let latestHosts = [];

function initNetwork() {
  const container = document.getElementById('topology-map');
  network = new vis.Network(
    container,
    { nodes: nodesDataSet, edges: edgesDataSet },
    {
      physics: { stabilization: true, barnesHut: { gravitationalConstant: -6000, springLength: 140 } },
      nodes: { shape: 'dot', font: { size: 11, face: 'Noto Sans JP,Arial', strokeWidth: 3, strokeColor: '#ffffff' } },
      edges: { color: { color: '#2e7d32' }, width: 2, smooth: false },
      interaction: { hover: true },
    },
  );
}

function buildGraph(hosts) {
  const nodes = [];
  const edges = [];
  const nameToId = {};

  hosts.forEach((h) => {
    nameToId[h.name.trim()] = `host-${h.hostid}`;
  });

  hosts.forEach((h) => {
    const role = getRole(h.hostid);
    const style = ROLE_STYLE[role] || ROLE_STYLE.other;
    const hasFault = h.problems.length > 0;
    const title = hasFault
      ? `${h.name} (${h.ip})\n役割: ${ROLE_LABELS[role]}\n\n⚠️ 障害:\n${h.problems.map((p) => '- ' + p.description).join('\n')}`
      : `${h.name} (${h.ip})\n役割: ${ROLE_LABELS[role]}`;

    nodes.push({
      id: `host-${h.hostid}`,
      label: `${h.name}\n${h.ip}`,
      size: style.size,
      color: {
        background: style.background,
        border: hasFault ? FAULT_BORDER : style.border,
        highlight: { background: '#fff176', border: hasFault ? FAULT_BORDER : style.border },
      },
      borderWidth: hasFault ? 4 : 1,
      title,
    });

    if (h.lldpNeighbor && h.lldpNeighbor.name) {
      const toName = h.lldpNeighbor.name.trim();
      let toId = nameToId[toName];
      if (!toId) {
        toId = `lldp-${toName}`;
        if (!nodes.find((n) => n.id === toId)) {
          nodes.push({
            id: toId,
            label: `${toName}\n(LLDP対向)`,
            size: 12,
            color: { background: '#90a4ae', border: '#455a64' },
          });
        }
        nameToId[toName] = toId;
      }
      edges.push({
        id: `edge-${h.hostid}-${toId}`,
        from: `host-${h.hostid}`,
        to: toId,
        title: h.lldpNeighbor.port ? `LLDP: ${h.lldpNeighbor.port}` : 'LLDP検出',
      });
    }
  });

  return { nodes, edges };
}

function applyIncrementalUpdate(nodes, edges) {
  const currentNodeIds = new Set(nodesDataSet.getIds());
  const currentEdgeIds = new Set(edgesDataSet.getIds());
  const newNodeIds = new Set(nodes.map((n) => n.id));
  const newEdgeIds = new Set(edges.map((e) => e.id));

  const staleNodeIds = [...currentNodeIds].filter((id) => !newNodeIds.has(id));
  const staleEdgeIds = [...currentEdgeIds].filter((id) => !newEdgeIds.has(id));

  if (staleEdgeIds.length > 0) edgesDataSet.remove(staleEdgeIds);
  if (staleNodeIds.length > 0) nodesDataSet.remove(staleNodeIds);
  if (nodes.length > 0) nodesDataSet.update(nodes);
  if (edges.length > 0) edgesDataSet.update(edges);
}

function renderHostTable(hosts) {
  const tbody = document.getElementById('topo-host-list');
  const noMsg = document.getElementById('no-topo-host-message');
  tbody.innerHTML = '';

  if (hosts.length === 0) {
    noMsg.style.display = 'block';
    return;
  }
  noMsg.style.display = 'none';

  hosts.forEach((h) => {
    const tr = document.createElement('tr');
    const role = getRole(h.hostid);
    const statusHtml = h.problems.length > 0
      ? `<span class="badge" style="background:#fdecea;color:${FAULT_BORDER};">障害中</span><ul class="problem-list">${h.problems.map((p) => `<li>${escapeHtml(p.description)}</li>`).join('')}</ul>`
      : `<span class="badge ${h.enabled ? 'badge-enabled' : 'badge-disabled'}">${h.enabled ? '正常' : '無効'}</span>`;

    tr.innerHTML = `
      <td>${escapeHtml(h.name)}</td>
      <td>${escapeHtml(h.ip)}</td>
      <td></td>
      <td>${statusHtml}</td>
    `;

    const roleTd = tr.children[2];
    const select = document.createElement('select');
    select.className = 'role-select';
    Object.keys(ROLE_LABELS).forEach((key) => {
      const opt = document.createElement('option');
      opt.value = key;
      opt.textContent = ROLE_LABELS[key];
      if (key === role) opt.selected = true;
      select.appendChild(opt);
    });
    select.addEventListener('change', () => {
      setRole(h.hostid, select.value);
      const { nodes, edges } = buildGraph(latestHosts);
      applyIncrementalUpdate(nodes, edges);
    });
    roleTd.appendChild(select);

    tbody.appendChild(tr);
  });
}

async function refreshTopology() {
  try {
    const hosts = await apiFetch('/topology');
    latestHosts = hosts;
    const { nodes, edges } = buildGraph(hosts);
    applyIncrementalUpdate(nodes, edges);
    renderHostTable(hosts);
    document.getElementById('topo-updated').textContent = `最終更新: ${new Date().toLocaleTimeString('ja-JP')}`;
  } catch (err) {
    document.getElementById('topo-updated').textContent = `更新エラー: ${err.message}`;
  }
}

initAppNav('topology');
initNetwork();
refreshTopology();
setInterval(refreshTopology, REFRESH_INTERVAL_MS);
</script>
</body>
</html>
