<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>ログイン | atLIB InfraVision ポータル</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="auth-page">
  <div class="auth-card">
    <h1>ログイン</h1>
    <form id="login-form">
      <div class="form-row">
        <label for="email">メールアドレス</label>
        <input type="email" id="email" required autocomplete="username">
      </div>
      <div class="form-row">
        <label for="password">パスワード</label>
        <input type="password" id="password" required autocomplete="current-password">
      </div>
      <div id="error" class="error-message" style="display:none;"></div>
      <button type="submit" class="btn" style="width:100%;" id="submit-btn">ログイン</button>
    </form>
    <div class="auth-links">
      <a href="/reset-password.html">パスワードをお忘れですか？</a>
    </div>
  </div>
</div>
<script src="/js/api.js"></script>
<script>
document.getElementById('login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const errorEl = document.getElementById('error');
  const submitBtn = document.getElementById('submit-btn');
  errorEl.style.display = 'none';
  submitBtn.disabled = true;

  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;

  try {
    const res = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password }),
      credentials: 'include',
    });
    if (res.status === 204) {
      location.href = '/home.html';
      return;
    }
    const data = await res.json().catch(() => ({}));
    if (data.error === 'Invalid email or password') {
      errorEl.textContent = 'メールアドレスまたはパスワードが正しくありません';
    } else if (res.status === 429) {
      errorEl.textContent = 'ログイン試行回数が上限に達しました。15分ほど時間をおいてから再度お試しください。';
    } else {
      errorEl.textContent = data.error || 'ログインに失敗しました';
    }
    errorEl.style.display = 'block';
  } catch {
    errorEl.textContent = '通信エラーが発生しました。しばらくしてから再度お試しください。';
    errorEl.style.display = 'block';
  } finally {
    submitBtn.disabled = false;
  }
});
</script>
</body>
</html>
