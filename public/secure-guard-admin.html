<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Secure Guard 管理</title><link rel="stylesheet" href="/css/style.css"></head>
<body><main class="page"><h1>atLIB Secure Guard｜全体管理</h1><p><a href="/secure-guard-home.html">ホームへ戻る</a></p><p id="admin-error" role="alert"></p>
<section class="card"><h2>DNSFilter Organization作成</h2><form id="organization-form"><div class="form-row"><label>表示名<input id="organization-name" required maxlength="255"></label></div><button class="btn">DNSFilterに作成して取込む</button></form><p>作成結果が不明な場合は自動再試行せず、監査履歴と既存Organization取込みで復旧します。</p></section>
<section class="card"><h2>既存DNSFilter Organization取込み</h2><form id="organization-import-form"><div class="form-row"><label>表示名<input id="import-organization-name" required maxlength="255"></label></div><div class="form-row"><label>DNSFilter Organization ID<input id="import-dnsfilter-organization-id" inputmode="numeric" pattern="[0-9]*" required></label></div><button class="btn btn-secondary">MSP所属を確認して取込む</button></form></section>
<section class="card"><h2>Organization一覧・設定</h2><div id="organizations"></div></section>
<section class="card"><h2>管理者招待</h2><form id="initial-invitation-form"><div class="form-row"><label>Organization ID<input id="initial-organization-id" required></label></div><div class="form-row"><label>メールアドレス<input id="initial-email" type="email" required></label></div><button class="btn">初期管理者を招待</button></form></section>
<section class="card"><h2>DNSFilter APIキー</h2><p>APIキーはこのアプリ、ブラウザ、DB、監査表示には入力・表示・保存しません。更新は統括承認後、Secret Managerの既存Secretを正規の運用手順で更新します。</p></section>
<section class="card"><h2>監査履歴</h2><div id="audit-events"></div></section></main><script src="/js/secureGuard.js"></script></body></html>
