<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>パスワード再設定 | atLIB InfraVision ポータル</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="auth-page">
  <div class="auth-card">
    <h1>パスワード再設定</h1>

    <div id="request-form-wrap">
      <p class="info-message">登録済みのメールアドレスを入力してください。再設定用のリンクをお送りします。</p>
      <form id="request-form">
        <div class="form-row">
          <label for="request-email">メールアドレス</label>
          <input type="email" id="request-email" required autocomplete="username">
        </div>
        <div id="request-error" class="error-message" style="display:none;"></div>
        <div id="request-success" class="success-message" style="display:none;">
          このメールアドレスが登録されている場合、再設定用のリンクを送信しました。メールをご確認ください。
        </div>
        <button type="submit" class="btn" style="width:100%;" id="request-submit">再設定リンクを送信</button>
      </form>
    </div>

    <div id="confirm-form-wrap" style="display:none;">
      <p class="info-message">新しいパスワードを入力してください（8文字以上）。</p>
      <form id="confirm-form">
        <div class="form-row">
          <label for="new-password">新しいパスワード</label>
          <input type="password" id="new-password" required minlength="8" autocomplete="new-password">
        </div>
        <div id="confirm-error" class="error-message" style="display:none;"></div>
        <button type="submit" class="btn" style="width:100%;" id="confirm-submit">パスワードを再設定</button>
      </form>
    </div>

    <div class="auth-links">
      <a href="/login.html">ログイン画面に戻る</a>
    </div>
  </div>
</div>
<script>
const params = new URLSearchParams(location.search);
const token = params.get('token');

if (token) {
  document.getElementById('request-form-wrap').style.display = 'none';
  document.getElementById('confirm-form-wrap').style.display = 'block';

  document.getElementById('confirm-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const errorEl = document.getElementById('confirm-error');
    const submitBtn = document.getElementById('confirm-submit');
    errorEl.style.display = 'none';
    submitBtn.disabled = true;

    const newPassword = document.getElementById('new-password').value;
    try {
      const res = await fetch('/api/auth/password-reset/confirm', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token, newPassword }),
      });
      if (res.status === 204) {
        location.href = '/login.html';
        return;
      }
      const data = await res.json().catch(() => ({}));
      errorEl.textContent = data.error === 'Invalid or expired token'
        ? 'このリンクは無効か、有効期限が切れています。もう一度再設定をリクエストしてください。'
        : (data.error || '再設定に失敗しました');
      errorEl.style.display = 'block';
    } catch {
      errorEl.textContent = '通信エラーが発生しました。しばらくしてから再度お試しください。';
      errorEl.style.display = 'block';
    } finally {
      submitBtn.disabled = false;
    }
  });
} else {
  document.getElementById('request-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const errorEl = document.getElementById('request-error');
    const successEl = document.getElementById('request-success');
    const submitBtn = document.getElementById('request-submit');
    errorEl.style.display = 'none';
    successEl.style.display = 'none';
    submitBtn.disabled = true;

    const email = document.getElementById('request-email').value;
    try {
      const res = await fetch('/api/auth/password-reset/request', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email }),
      });
      if (res.status === 204) {
        successEl.style.display = 'block';
        document.getElementById('request-form').reset();
      } else {
        const data = await res.json().catch(() => ({}));
        errorEl.textContent = data.error || 'リクエストに失敗しました';
        errorEl.style.display = 'block';
      }
    } catch {
      errorEl.textContent = '通信エラーが発生しました。しばらくしてから再度お試しください。';
      errorEl.style.display = 'block';
    } finally {
      submitBtn.disabled = false;
    }
  });
}
</script>
</body>
</html>
