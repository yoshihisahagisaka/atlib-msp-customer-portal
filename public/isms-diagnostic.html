<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>ISMS支援プラン診断 | atLIB InfraVision</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/lp.css">
<style>
  /* 質問文(Q)は通常のフォームlabel(小さめ・薄いグレー)より目立たせる */
  .question-prompt {
    display: block;
    font-size: 1.05rem;
    font-weight: 600;
    color: var(--color-text);
    margin-bottom: 0.6rem;
    line-height: 1.5;
  }
</style>
</head>
<body>

<nav class="lp-nav">
  <div class="brand">atLIB <span>ISMS支援プラン診断</span></div>
</nav>

<div class="section" style="max-width:680px;">
  <h1 class="section-title" style="text-align:left;">ISMS支援プラン診断</h1>
  <p class="info-message" id="intro-message">
    貴社の体制・知識・インフラ実作業力を簡単な質問でお伺いし、最適な支援プランをご提案するための診断です。
    所要時間は3分程度です。ご回答内容は担当者が確認のうえ、折り返しご連絡いたします（この場ではスコア・推奨プランは表示されません）。
  </p>

  <form id="diagnostic-form">
    <div id="diagnostic-questions">
      <p class="info-message">質問を読み込んでいます...</p>
    </div>

    <div class="card" style="margin-top:1.5rem;">
      <h2>ご連絡先</h2>
      <div class="form-row">
        <label for="company-name">会社名</label>
        <input type="text" id="company-name" required autocomplete="organization">
      </div>
      <div class="form-row">
        <label for="contact-name">ご担当者名</label>
        <input type="text" id="contact-name" required autocomplete="name">
      </div>
      <div class="form-row">
        <label for="email">メールアドレス</label>
        <input type="email" id="email" required autocomplete="email">
      </div>
      <div class="form-row">
        <label for="phone">電話番号（任意）</label>
        <input type="text" id="phone" autocomplete="tel">
      </div>
    </div>

    <div id="diagnostic-error" class="error-message" style="display:none;"></div>
    <div id="diagnostic-success" class="success-message" style="display:none;">
      ご協力ありがとうございました。<br>
      診断の回答を受け付けました。内容を確認のうえ、担当者よりご連絡いたします。
    </div>
    <button type="submit" class="btn" style="width:100%;" id="diagnostic-submit">診断を送信する</button>
  </form>

  <div id="close-wrap" style="display:none; margin-top:2rem;">
    <button type="button" class="btn btn-secondary" id="close-btn">閉じる</button>
  </div>
</div>

<script>
const CATEGORY_HEADING_OVERRIDES = {
  profile: '組織・予算・スケジュールについて',
};

function renderQuestion(question) {
  const wrap = document.createElement('div');
  wrap.className = 'form-row';

  const legend = document.createElement('label');
  legend.className = 'question-prompt';
  legend.textContent = question.prompt;
  wrap.appendChild(legend);

  if (question.type === 'single-choice') {
    const group = document.createElement('div');
    group.className = 'radio-group';
    group.style.flexDirection = 'column';
    group.style.gap = '0.5rem';
    question.options.forEach((option, i) => {
      const optionLabel = document.createElement('label');
      const input = document.createElement('input');
      input.type = 'radio';
      input.name = question.id;
      input.value = option.value;
      input.required = question.required;
      if (i === 0) input.dataset.first = 'true';
      optionLabel.appendChild(input);
      optionLabel.appendChild(document.createTextNode(' ' + option.label));
      group.appendChild(optionLabel);
    });
    wrap.appendChild(group);
  } else {
    const input = document.createElement('input');
    input.type = 'text';
    input.name = question.id;
    input.required = question.required;
    wrap.appendChild(input);
  }

  return wrap;
}

async function loadQuestions() {
  const container = document.getElementById('diagnostic-questions');
  try {
    const res = await fetch('/api/isms-diagnostic/questions');
    if (!res.ok) throw new Error('failed to load questions');
    const data = await res.json();

    container.innerHTML = '';
    data.categories.forEach((category) => {
      const questions = data.questions.filter((q) => q.categoryId === category.id);
      if (questions.length === 0) return;

      const section = document.createElement('div');
      section.className = 'card';

      const heading = document.createElement('h2');
      heading.textContent = CATEGORY_HEADING_OVERRIDES[category.id] || category.label;
      section.appendChild(heading);

      questions.forEach((q) => section.appendChild(renderQuestion(q)));
      container.appendChild(section);
    });

    container.dataset.loaded = 'true';
  } catch {
    container.innerHTML = '<p class="error-message">質問の読み込みに失敗しました。ページを再読み込みしてください。</p>';
  }
}

function collectAnswers(form) {
  const answers = {};
  const formData = new FormData(form);
  for (const [key, value] of formData.entries()) {
    if (['company-name', 'contact-name', 'email', 'phone'].includes(key)) continue;
    answers[key] = value;
  }
  return answers;
}

document.getElementById('diagnostic-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const errorEl = document.getElementById('diagnostic-error');
  const successEl = document.getElementById('diagnostic-success');
  const form = document.getElementById('diagnostic-form');
  const submitBtn = document.getElementById('diagnostic-submit');
  errorEl.style.display = 'none';
  successEl.style.display = 'none';
  submitBtn.disabled = true;

  const payload = {
    companyName: document.getElementById('company-name').value,
    contactName: document.getElementById('contact-name').value,
    email: document.getElementById('email').value,
    phone: document.getElementById('phone').value || undefined,
    answers: collectAnswers(form),
  };

  try {
    const res = await fetch('/api/isms-diagnostic', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
    if (res.status === 204) {
      document.getElementById('intro-message').style.display = 'none';
      successEl.style.display = 'block';
      form.reset();
      form.style.display = 'none';
      document.getElementById('close-wrap').style.display = 'block';
    } else {
      const data = await res.json().catch(() => ({}));
      errorEl.textContent = data.error || '送信に失敗しました。しばらくしてから再度お試しください。';
      errorEl.style.display = 'block';
    }
  } catch {
    errorEl.textContent = '通信エラーが発生しました。しばらくしてから再度お試しください。';
    errorEl.style.display = 'block';
  } finally {
    submitBtn.disabled = false;
  }
});

document.getElementById('close-btn').addEventListener('click', () => {
  window.close();
});

loadQuestions();
</script>
</body>
</html>
