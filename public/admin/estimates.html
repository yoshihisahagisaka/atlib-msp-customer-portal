<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>見積一覧 | atLIB Admin</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div class="page" style="max-width:1200px;">
  <h1>原価見積ツール</h1>
  <p>
    <a href="/admin/market-rates.html">相場マスタ</a>　|
    <a href="/admin/estimate-preconditions.html">前提条件マスタ</a>
  </p>

  <div class="card">
    <a href="/admin/estimate-detail.html" class="btn">＋ 新規見積作成</a>
  </div>

  <div class="card">
    <div style="display:flex; gap:1rem; flex-wrap:wrap;">
      <div class="form-row" style="max-width:220px;">
        <label for="category-filter">カテゴリ</label>
        <select id="category-filter">
          <option value="">すべて</option>
          <option value="network">ネットワーク構築</option>
          <option value="server">サーバー構築</option>
          <option value="kitting">PCキッティング</option>
          <option value="dev">システム開発</option>
          <option value="other">その他</option>
        </select>
      </div>
      <div class="form-row" style="max-width:220px;">
        <label for="status-filter">ステータス</label>
        <select id="status-filter">
          <option value="">すべて</option>
          <option value="draft">下書き</option>
          <option value="confirmed">確定</option>
          <option value="archived">アーカイブ</option>
        </select>
      </div>
    </div>

    <div id="list-error" class="error-message" style="display:none;"></div>
    <div id="list-loading" class="info-message">読み込み中...</div>

    <table id="list-table" style="display:none;">
      <thead>
        <tr>
          <th>タイトル</th>
          <th>顧客名</th>
          <th>カテゴリ</th>
          <th>ステータス</th>
          <th>見積総額</th>
          <th>作成日</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="list-body"></tbody>
    </table>
  </div>
</div>

<script>
const CATEGORY_LABELS = { network: 'ネットワーク構築', server: 'サーバー構築', kitting: 'PCキッティング', dev: 'システム開発', other: 'その他' };
const STATUS_LABELS = { draft: '下書き', confirmed: '確定', archived: 'アーカイブ' };

function formatYen(n) {
  return '¥' + Number(n).toLocaleString('ja-JP');
}

function formatDate(iso) {
  const d = new Date(iso);
  const pad = (n) => String(n).padStart(2, '0');
  return `${d.getFullYear()}/${pad(d.getMonth() + 1)}/${pad(d.getDate())}`;
}

async function loadList() {
  const loadingEl = document.getElementById('list-loading');
  const errorEl = document.getElementById('list-error');
  const table = document.getElementById('list-table');
  const tbody = document.getElementById('list-body');
  const category = document.getElementById('category-filter').value;
  const status = document.getElementById('status-filter').value;

  loadingEl.style.display = 'block';
  loadingEl.textContent = '読み込み中...';
  errorEl.style.display = 'none';
  table.style.display = 'none';

  try {
    const params = new URLSearchParams();
    if (category) params.set('category', category);
    if (status) params.set('status', status);
    const res = await fetch('/api/admin/estimates?' + params.toString());
    if (!res.ok) throw new Error('failed to load');
    const data = await res.json();

    tbody.innerHTML = '';
    data.items.forEach((item) => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td><a href="/admin/estimate-detail.html?id=${encodeURIComponent(item.id)}">${item.title}</a></td>
        <td>${item.customerName || '-'}</td>
        <td>${CATEGORY_LABELS[item.category] || item.category}</td>
        <td>
          <select data-status-id="${item.id}">
            <option value="draft"${item.status === 'draft' ? ' selected' : ''}>下書き</option>
            <option value="confirmed"${item.status === 'confirmed' ? ' selected' : ''}>確定</option>
            <option value="archived"${item.status === 'archived' ? ' selected' : ''}>アーカイブ</option>
          </select>
        </td>
        <td>${formatYen(item.grandTotal)}</td>
        <td>${formatDate(item.createdAt)}</td>
        <td><a href="/admin/estimate-detail.html?id=${encodeURIComponent(item.id)}">編集</a></td>
      `;
      tbody.appendChild(tr);
    });

    loadingEl.style.display = 'none';
    table.style.display = data.items.length > 0 ? 'table' : 'none';
    if (data.items.length === 0) {
      loadingEl.textContent = '該当する見積はありません。';
      loadingEl.style.display = 'block';
    }
  } catch {
    loadingEl.style.display = 'none';
    errorEl.textContent = '一覧の取得に失敗しました。ページを再読み込みしてください。';
    errorEl.style.display = 'block';
  }
}

document.getElementById('category-filter').addEventListener('change', loadList);
document.getElementById('status-filter').addEventListener('change', loadList);

document.getElementById('list-body').addEventListener('change', async (e) => {
  const select = e.target.closest('select[data-status-id]');
  if (!select) return;
  await fetch('/api/admin/estimates/' + encodeURIComponent(select.dataset.statusId) + '/status', {
    method: 'PATCH',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ status: select.value }),
  });
});

loadList();
</script>
</body>
</html>
