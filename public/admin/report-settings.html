<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>月次レポート設定 | atLIB Admin</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<nav class="app-nav" id="admin-nav"></nav>

<div class="page" style="max-width:700px;">
  <h1>月次レポート設定(WANインターフェース)</h1>

  <div class="card">
    <div class="form-row">
      <label for="customer-select">顧客</label>
      <select id="customer-select">
        <option value="">── 顧客を選択 ──</option>
      </select>
    </div>

    <div id="candidates-info" class="info-message" style="display:none;"></div>

    <form id="settings-form">
      <div class="form-row">
        <label for="wan-if-in">WAN IN(Zabbixアイテム)</label>
        <select id="wan-if-in">
          <option value="">── IN ──</option>
        </select>
      </div>
      <div class="form-row">
        <label for="wan-if-out">WAN OUT(Zabbixアイテム)</label>
        <select id="wan-if-out">
          <option value="">── OUT ──</option>
        </select>
      </div>
      <div id="form-error" class="error-message" style="display:none;"></div>
      <div id="form-info" class="info-message" style="display:none;"></div>
      <button type="submit" class="btn">保存</button>
    </form>
  </div>
</div>

<script>
function selectedCustomerCode() {
  return document.getElementById('customer-select').value;
}

async function loadCustomers() {
  const sel = document.getElementById('customer-select');
  const res = await fetch('/api/admin/ops-history/customers');
  if (!res.ok) throw new Error('failed to load customers');
  const data = await res.json();
  data.items.forEach((c) => {
    const opt = document.createElement('option');
    opt.value = c.customerCode;
    opt.textContent = `${c.companyName}(${c.customerCode})`;
    sel.appendChild(opt);
  });
}

/** 候補一覧に現在値が無い場合(手入力の古い値等)、選択肢から消えて上書きされないよう先頭に追加しておく。 */
function populateSelect(selectEl, placeholder, candidates, currentValue) {
  selectEl.innerHTML = `<option value="">${placeholder}</option>`;
  let found = false;
  candidates.forEach((c) => {
    const opt = document.createElement('option');
    opt.value = c.itemid;
    opt.textContent = c.label;
    if (c.itemid === currentValue) found = true;
    selectEl.appendChild(opt);
  });
  if (currentValue && !found) {
    const opt = document.createElement('option');
    opt.value = currentValue;
    opt.textContent = `現在の設定値(候補になし): ${currentValue}`;
    selectEl.appendChild(opt);
  }
  selectEl.value = currentValue || '';
}

async function loadSettings() {
  const customerCode = selectedCustomerCode();
  const wanIn = document.getElementById('wan-if-in');
  const wanOut = document.getElementById('wan-if-out');
  const infoEl = document.getElementById('candidates-info');
  infoEl.style.display = 'none';

  if (!customerCode) {
    wanIn.innerHTML = '<option value="">── IN ──</option>';
    wanOut.innerHTML = '<option value="">── OUT ──</option>';
    return;
  }

  const [settingsRes, candidatesRes] = await Promise.all([
    fetch(`/api/admin/report-settings/${encodeURIComponent(customerCode)}`),
    fetch(`/api/admin/report-settings/${encodeURIComponent(customerCode)}/wan-candidates`),
  ]);
  const settings = settingsRes.ok ? await settingsRes.json() : { wanIfIn: null, wanIfOut: null };
  const candidates = candidatesRes.ok ? await candidatesRes.json() : { in: [], out: [] };

  populateSelect(wanIn, '── IN ──', candidates.in, settings.wanIfIn);
  populateSelect(wanOut, '── OUT ──', candidates.out, settings.wanIfOut);

  if (candidates.in.length === 0 && candidates.out.length === 0) {
    infoEl.textContent = 'Zabbix側でこの顧客のWANトラフィックアイテムが見つかりませんでした(ホストグループ未紐付け、またはルーター役割タグ未設定の可能性があります)。';
    infoEl.style.display = 'block';
  }
}

async function onSubmit(ev) {
  ev.preventDefault();
  const errorEl = document.getElementById('form-error');
  const infoEl = document.getElementById('form-info');
  errorEl.style.display = 'none';
  infoEl.style.display = 'none';

  const customerCode = selectedCustomerCode();
  if (!customerCode) {
    errorEl.textContent = '顧客を選択してください。';
    errorEl.style.display = 'block';
    return;
  }

  const body = {
    wanIfIn: document.getElementById('wan-if-in').value || undefined,
    wanIfOut: document.getElementById('wan-if-out').value || undefined,
  };

  try {
    const res = await fetch(`/api/admin/report-settings/${encodeURIComponent(customerCode)}`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    if (!res.ok) throw new Error('failed to save');
    infoEl.textContent = '保存しました。';
    infoEl.style.display = 'block';
  } catch {
    errorEl.textContent = '保存に失敗しました。入力内容を確認してもう一度お試しください。';
    errorEl.style.display = 'block';
  }
}

document.getElementById('customer-select').addEventListener('change', loadSettings);
document.getElementById('settings-form').addEventListener('submit', onSubmit);

loadCustomers().catch(() => {
  document.getElementById('form-error').textContent = '顧客一覧の取得に失敗しました。';
  document.getElementById('form-error').style.display = 'block';
});
</script>
<script src="/admin/js/adminNav.js"></script>
<script>initAdminNav('report-settings');</script>
</body>
</html>
