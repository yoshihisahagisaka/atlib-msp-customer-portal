<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>申込み一覧 | atLIB Admin</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<nav class="app-nav" id="admin-nav"></nav>

<div class="page" style="max-width:1100px;">
  <h1>申込み一覧</h1>

  <div class="card">
    <div class="form-row" style="max-width:240px;">
      <label for="status-filter">対応状況で絞り込み</label>
      <select id="status-filter">
        <option value="">すべて</option>
        <option value="new">未対応</option>
        <option value="contacted">連絡済</option>
        <option value="scheduled">ヒアリング予定</option>
        <option value="closed">完了</option>
      </select>
    </div>

    <div id="list-error" class="error-message" style="display:none;"></div>
    <div id="list-loading" class="info-message">読み込み中...</div>

    <table id="list-table" style="display:none;">
      <thead>
        <tr>
          <th>送信日時</th>
          <th>会社名</th>
          <th>担当者</th>
          <th>メール</th>
          <th>興味のあるプラン</th>
          <th>対応状況</th>
          <th>通知</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="list-body"></tbody>
    </table>
  </div>
</div>

<script>
const STATUS_LABELS = { new: '未対応', contacted: '連絡済', scheduled: 'ヒアリング予定', closed: '完了' };

function formatDate(iso) {
  const d = new Date(iso);
  const pad = (n) => String(n).padStart(2, '0');
  return `${d.getFullYear()}/${pad(d.getMonth() + 1)}/${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

async function loadList() {
  const loadingEl = document.getElementById('list-loading');
  const errorEl = document.getElementById('list-error');
  const table = document.getElementById('list-table');
  const tbody = document.getElementById('list-body');
  const status = document.getElementById('status-filter').value;

  loadingEl.style.display = 'block';
  errorEl.style.display = 'none';
  table.style.display = 'none';

  try {
    const qs = status ? `?status=${encodeURIComponent(status)}` : '';
    const res = await fetch('/api/admin/customer-applications' + qs);
    if (!res.ok) throw new Error('failed to load');
    const data = await res.json();

    tbody.innerHTML = '';
    data.items.forEach((item) => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${formatDate(item.submittedAt)}</td>
        <td>${item.companyName}</td>
        <td>${item.contactName}</td>
        <td>${item.email}</td>
        <td>${item.interestedPlan || '-'}</td>
        <td>${STATUS_LABELS[item.reviewStatus] || item.reviewStatus}</td>
        <td>${item.notificationEmailSentAt ? '<span class="badge badge-enabled">送信済</span>' : '<span class="badge badge-disabled">未送信</span>'}</td>
        <td><a href="/admin/customer-applications-detail.html?id=${encodeURIComponent(item.id)}">詳細</a></td>
      `;
      tbody.appendChild(tr);
    });

    loadingEl.style.display = 'none';
    table.style.display = data.items.length > 0 ? 'table' : 'none';
    if (data.items.length === 0) {
      loadingEl.textContent = '該当する申込みはありません。';
      loadingEl.style.display = 'block';
    }
  } catch {
    loadingEl.style.display = 'none';
    errorEl.textContent = '一覧の取得に失敗しました。ページを再読み込みしてください。';
    errorEl.style.display = 'block';
  }
}

document.getElementById('status-filter').addEventListener('change', loadList);
loadList();
</script>
<script src="/admin/js/adminNav.js"></script>
<script>initAdminNav('customer-applications');</script>
</body>
</html>
