<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>申込み詳細 | atLIB Admin</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div class="page" style="max-width:720px;">
  <p><a href="/admin/customer-applications.html">&larr; 一覧に戻る</a></p>
  <h1>申込み詳細</h1>

  <div id="detail-error" class="error-message" style="display:none;"></div>
  <div id="detail-loading" class="info-message">読み込み中...</div>

  <div id="detail-content" class="card" style="display:none;">
    <table>
      <tbody>
        <tr><th>送信日時</th><td id="f-submitted"></td></tr>
        <tr><th>会社名</th><td id="f-company"></td></tr>
        <tr><th>担当者</th><td id="f-contact"></td></tr>
        <tr><th>メール</th><td id="f-email"></td></tr>
        <tr><th>電話番号</th><td id="f-phone"></td></tr>
        <tr><th>興味のあるプラン</th><td id="f-plan"></td></tr>
        <tr><th>ご要望・備考</th><td id="f-message" style="white-space:pre-wrap;"></td></tr>
        <tr><th>通知メール</th><td id="f-notified"></td></tr>
      </tbody>
    </table>

    <div class="form-row" style="max-width:240px; margin-top:1rem;">
      <label for="status-select">対応状況</label>
      <select id="status-select">
        <option value="new">未対応</option>
        <option value="contacted">連絡済</option>
        <option value="scheduled">ヒアリング予定</option>
        <option value="closed">完了</option>
      </select>
    </div>
    <button class="btn" id="save-status">保存する</button>
    <div id="save-message" class="success-message" style="display:none;"></div>

    <p class="info-message" style="margin-top:1.5rem;">
      ヒアリング（Web会議）でプラン・IPレンジ等が確定したら、「Sensor Edge 機器管理台帳」の「顧客マスタ」タブで
      顧客IDを割り当て、通常のオンボーディング手順（運用手順書_顧客オンボーディング統合フロー.md 手順1以降）に進んでください。
    </p>
  </div>
</div>

<script>
function getId() {
  return new URLSearchParams(location.search).get('id');
}

function formatDate(iso) {
  if (!iso) return '-';
  const d = new Date(iso);
  const pad = (n) => String(n).padStart(2, '0');
  return `${d.getFullYear()}/${pad(d.getMonth() + 1)}/${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

async function loadDetail() {
  const id = getId();
  const loadingEl = document.getElementById('detail-loading');
  const errorEl = document.getElementById('detail-error');
  const content = document.getElementById('detail-content');

  if (!id) {
    loadingEl.style.display = 'none';
    errorEl.textContent = 'idが指定されていません。';
    errorEl.style.display = 'block';
    return;
  }

  try {
    const res = await fetch('/api/admin/customer-applications/' + encodeURIComponent(id));
    if (!res.ok) throw new Error('failed to load');
    const item = await res.json();

    document.getElementById('f-submitted').textContent = formatDate(item.submittedAt);
    document.getElementById('f-company').textContent = item.companyName;
    document.getElementById('f-contact').textContent = item.contactName;
    document.getElementById('f-email').textContent = item.email;
    document.getElementById('f-phone').textContent = item.phone || '-';
    document.getElementById('f-plan').textContent = item.interestedPlan || '-';
    document.getElementById('f-message').textContent = item.message || '-';
    document.getElementById('f-notified').textContent = item.notificationEmailSentAt
      ? `送信済（${formatDate(item.notificationEmailSentAt)}）`
      : '未送信';
    document.getElementById('status-select').value = item.reviewStatus;

    loadingEl.style.display = 'none';
    content.style.display = 'block';
  } catch {
    loadingEl.style.display = 'none';
    errorEl.textContent = '詳細の取得に失敗しました。ページを再読み込みしてください。';
    errorEl.style.display = 'block';
  }
}

document.getElementById('save-status').addEventListener('click', async () => {
  const id = getId();
  const status = document.getElementById('status-select').value;
  const saveMessage = document.getElementById('save-message');
  saveMessage.style.display = 'none';

  try {
    const res = await fetch(`/api/admin/customer-applications/${encodeURIComponent(id)}/status`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ status }),
    });
    if (!res.ok) throw new Error('failed to save');
    saveMessage.className = 'success-message';
    saveMessage.textContent = '保存しました。';
    saveMessage.style.display = 'block';
  } catch {
    saveMessage.className = 'error-message';
    saveMessage.textContent = '保存に失敗しました。';
    saveMessage.style.display = 'block';
  }
});

loadDetail();
</script>
</body>
</html>
