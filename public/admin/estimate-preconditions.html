<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>前提条件マスタ | atLIB Admin</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div class="page" style="max-width:900px;">
  <h1>前提条件マスタ</h1>
  <p><a href="/admin/estimates.html">← 見積一覧に戻る</a></p>

  <div class="card">
    <h2>新規登録</h2>
    <form id="create-form">
      <div class="form-row">
        <label for="c-category">カテゴリ</label>
        <select id="c-category" required>
          <option value="network">ネットワーク構築</option>
          <option value="server">サーバー構築</option>
          <option value="kitting">PCキッティング</option>
          <option value="dev">システム開発</option>
          <option value="other">その他</option>
        </select>
      </div>
      <div class="form-row">
        <label for="c-label">前提条件の内容</label>
        <input type="text" id="c-label" required maxlength="300" placeholder="例: 既設ラック内での作業を前提とする">
      </div>
      <div class="form-row">
        <label for="c-sort-order">表示順（小さいほど先に表示）</label>
        <input type="number" id="c-sort-order" value="0" step="1">
      </div>
      <div id="create-error" class="error-message" style="display:none;"></div>
      <button type="submit" class="btn">登録する</button>
    </form>
  </div>

  <div id="list-error" class="error-message" style="display:none;"></div>
  <div id="list-loading" class="info-message">読み込み中...</div>
  <div id="groups"></div>
</div>

<script>
const CATEGORIES = [
  { value: 'network', label: 'ネットワーク構築' },
  { value: 'server', label: 'サーバー構築' },
  { value: 'kitting', label: 'PCキッティング' },
  { value: 'dev', label: 'システム開発' },
  { value: 'other', label: 'その他' },
];

async function loadList() {
  const loadingEl = document.getElementById('list-loading');
  const errorEl = document.getElementById('list-error');
  const groupsEl = document.getElementById('groups');

  loadingEl.style.display = 'block';
  loadingEl.textContent = '読み込み中...';
  errorEl.style.display = 'none';
  groupsEl.innerHTML = '';

  try {
    const res = await fetch('/api/admin/estimate-preconditions?includeInactive=true');
    if (!res.ok) throw new Error('failed to load');
    const data = await res.json();

    CATEGORIES.forEach((cat) => {
      const items = data.items.filter((item) => item.category === cat.value);
      const card = document.createElement('div');
      card.className = 'card';
      const rows = items
        .map(
          (item) => `
        <tr${item.isActive ? '' : ' style="opacity:0.5;"'}>
          <td>${item.sortOrder}</td>
          <td>${item.label}</td>
          <td>${item.isActive ? '<span class="badge badge-enabled">有効</span>' : '<span class="badge badge-disabled">無効</span>'}</td>
          <td><button type="button" class="btn btn-small btn-secondary" data-toggle-id="${item.id}" data-toggle-active="${item.isActive}" data-label="${item.label.replace(/"/g, '&quot;')}" data-sort-order="${item.sortOrder}">${item.isActive ? '無効化' : '有効化'}</button></td>
        </tr>`,
        )
        .join('');
      card.innerHTML = `
        <h2>${cat.label}</h2>
        ${items.length === 0 ? '<p class="info-message">登録された前提条件はありません。</p>' : `
        <table>
          <thead><tr><th>順序</th><th>内容</th><th>状態</th><th></th></tr></thead>
          <tbody>${rows}</tbody>
        </table>`}
      `;
      groupsEl.appendChild(card);
    });

    loadingEl.style.display = 'none';
  } catch {
    loadingEl.style.display = 'none';
    errorEl.textContent = '一覧の取得に失敗しました。ページを再読み込みしてください。';
    errorEl.style.display = 'block';
  }
}

document.getElementById('groups').addEventListener('click', async (e) => {
  const btn = e.target.closest('button[data-toggle-id]');
  if (!btn) return;
  const id = btn.dataset.toggleId;
  const currentlyActive = btn.dataset.toggleActive === 'true';

  await fetch('/api/admin/estimate-preconditions/' + encodeURIComponent(id), {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      label: btn.dataset.label,
      sortOrder: Number(btn.dataset.sortOrder),
      isActive: !currentlyActive,
    }),
  });
  loadList();
});

document.getElementById('create-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const errorEl = document.getElementById('create-error');
  errorEl.style.display = 'none';

  const body = {
    category: document.getElementById('c-category').value,
    label: document.getElementById('c-label').value,
    sortOrder: Number(document.getElementById('c-sort-order').value) || 0,
  };

  try {
    const res = await fetch('/api/admin/estimate-preconditions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    if (!res.ok) {
      const data = await res.json().catch(() => ({}));
      throw new Error(data.error || '登録に失敗しました');
    }
    e.target.reset();
    document.getElementById('c-category').value = 'network';
    document.getElementById('c-sort-order').value = '0';
    loadList();
  } catch (err) {
    errorEl.textContent = err.message || '登録に失敗しました';
    errorEl.style.display = 'block';
  }
});

loadList();
</script>
</body>
</html>
