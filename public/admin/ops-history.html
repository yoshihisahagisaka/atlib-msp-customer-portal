<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>運用対応履歴 | atLIB Admin</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<nav class="app-nav" id="admin-nav"></nav>

<div class="page" style="max-width:900px;">
  <h1>運用対応履歴</h1>

  <div class="card">
    <div class="form-row">
      <label for="customer-select">顧客</label>
      <select id="customer-select">
        <option value="">── 顧客を選択 ──</option>
      </select>
    </div>
    <div id="quota-summary" class="info-message" style="display:none;"></div>
  </div>

  <div class="card">
    <h2>新規登録</h2>
    <form id="entry-form">
      <div class="form-row">
        <label for="occurred-at">対応日時</label>
        <input type="datetime-local" id="occurred-at" required>
      </div>
      <div class="form-row">
        <label for="category">カテゴリ</label>
        <select id="category"></select>
      </div>
      <div class="form-row" id="description-row">
        <label for="description">対応内容・処置詳細</label>
        <input type="text" id="description">
      </div>
      <div class="form-row">
        <label for="operator">対応者</label>
        <input type="text" id="operator" required>
      </div>
      <div class="form-row" style="max-width:160px;">
        <label for="minutes-spent">工数（分）</label>
        <input type="text" id="minutes-spent" inputmode="numeric" value="0" required>
      </div>
      <div class="form-row">
        <label>
          <input type="checkbox" id="plan-quota-consumed" checked>
          リモート運用プランの月間枠（4回まで）を消費する対応
        </label>
      </div>
      <div id="form-error" class="error-message" style="display:none;"></div>
      <button type="submit" class="btn">登録</button>
    </form>
  </div>

  <div class="card">
    <h2>登録済み履歴（直近50件）</h2>
    <div id="list-error" class="error-message" style="display:none;"></div>
    <div id="list-loading" class="info-message">顧客を選択してください。</div>
    <table id="list-table" style="display:none;">
      <thead>
        <tr>
          <th>対応日時</th>
          <th>カテゴリ</th>
          <th>対応内容</th>
          <th>対応者</th>
          <th>工数(分)</th>
          <th>枠消費</th>
        </tr>
      </thead>
      <tbody id="list-body"></tbody>
    </table>
  </div>
</div>

<script>
const CATEGORIES = ['VPNアカウント追加削除', 'Wi-Fiパスワード変更', '機器再起動対応', '障害切り分け・トラブル対応', 'その他'];

function formatDateTime(iso) {
  const d = new Date(iso);
  const pad = (n) => String(n).padStart(2, '0');
  return `${d.getFullYear()}/${pad(d.getMonth() + 1)}/${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

function currentPeriod() {
  const now = new Date();
  return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
}

function selectedCustomerCode() {
  return document.getElementById('customer-select').value;
}

function populateCategories() {
  const sel = document.getElementById('category');
  sel.innerHTML = CATEGORIES.map((c) => `<option value="${c}">${c}</option>`).join('');
  onCategoryChange();
}

function onCategoryChange() {
  const isOther = document.getElementById('category').value === 'その他';
  document.getElementById('description').required = isOther;
}

async function loadCustomers() {
  const sel = document.getElementById('customer-select');
  const res = await fetch('/api/admin/ops-history/customers');
  if (!res.ok) throw new Error('failed to load customers');
  const data = await res.json();
  data.items.forEach((c) => {
    const opt = document.createElement('option');
    opt.value = c.customerCode;
    opt.textContent = `${c.companyName}（${c.customerCode}）`;
    sel.appendChild(opt);
  });
}

async function loadQuotaSummary() {
  const box = document.getElementById('quota-summary');
  const customerCode = selectedCustomerCode();
  if (!customerCode) {
    box.style.display = 'none';
    return;
  }
  const period = currentPeriod();
  const res = await fetch(`/api/admin/ops-history/quota-summary?customerCode=${encodeURIComponent(customerCode)}&period=${period}`);
  if (!res.ok) {
    box.style.display = 'none';
    return;
  }
  const data = await res.json();
  box.textContent = `今月（${period}）の枠消費件数: ${data.consumedCount} 件`;
  box.style.display = 'block';
}

async function loadList() {
  const errorEl = document.getElementById('list-error');
  const loadingEl = document.getElementById('list-loading');
  const table = document.getElementById('list-table');
  const tbody = document.getElementById('list-body');
  const customerCode = selectedCustomerCode();

  errorEl.style.display = 'none';
  table.style.display = 'none';

  if (!customerCode) {
    loadingEl.textContent = '顧客を選択してください。';
    loadingEl.style.display = 'block';
    return;
  }

  loadingEl.textContent = '読み込み中...';
  loadingEl.style.display = 'block';

  try {
    const res = await fetch(`/api/admin/ops-history?customerCode=${encodeURIComponent(customerCode)}&limit=50`);
    if (!res.ok) throw new Error('failed to load');
    const data = await res.json();

    tbody.innerHTML = '';
    data.items.forEach((item) => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${formatDateTime(item.occurredAt)}</td>
        <td>${item.category}</td>
        <td>${item.description ?? ''}</td>
        <td>${item.operator}</td>
        <td>${item.minutesSpent}</td>
        <td>${item.planQuotaConsumed ? '<span class="badge badge-enabled">消費</span>' : '<span class="badge badge-disabled">対象外</span>'}</td>
      `;
      tbody.appendChild(tr);
    });

    loadingEl.style.display = 'none';
    table.style.display = data.items.length > 0 ? 'table' : 'none';
    if (data.items.length === 0) {
      loadingEl.textContent = '登録済みの履歴はありません。';
      loadingEl.style.display = 'block';
    }
  } catch {
    loadingEl.style.display = 'none';
    errorEl.textContent = '一覧の取得に失敗しました。ページを再読み込みしてください。';
    errorEl.style.display = 'block';
  }
}

async function onSubmit(ev) {
  ev.preventDefault();
  const errorEl = document.getElementById('form-error');
  errorEl.style.display = 'none';

  const customerCode = selectedCustomerCode();
  if (!customerCode) {
    errorEl.textContent = '顧客を選択してください。';
    errorEl.style.display = 'block';
    return;
  }

  const occurredAtLocal = document.getElementById('occurred-at').value;
  if (!occurredAtLocal) {
    errorEl.textContent = '対応日時を入力してください。';
    errorEl.style.display = 'block';
    return;
  }

  const body = {
    customerCode,
    occurredAt: new Date(occurredAtLocal).toISOString(),
    category: document.getElementById('category').value,
    description: document.getElementById('description').value || undefined,
    operator: document.getElementById('operator').value,
    minutesSpent: Number(document.getElementById('minutes-spent').value || 0),
    planQuotaConsumed: document.getElementById('plan-quota-consumed').checked,
  };

  try {
    const res = await fetch('/api/admin/ops-history', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    if (!res.ok) throw new Error('failed to save');

    document.getElementById('entry-form').reset();
    document.getElementById('minutes-spent').value = '0';
    populateCategories();
    await Promise.all([loadList(), loadQuotaSummary()]);
  } catch {
    errorEl.textContent = '登録に失敗しました。入力内容を確認してもう一度お試しください。';
    errorEl.style.display = 'block';
  }
}

document.getElementById('customer-select').addEventListener('change', () => {
  loadList();
  loadQuotaSummary();
});
document.getElementById('category').addEventListener('change', onCategoryChange);
document.getElementById('entry-form').addEventListener('submit', onSubmit);

populateCategories();
loadCustomers().catch(() => {
  document.getElementById('list-error').textContent = '顧客一覧の取得に失敗しました。';
  document.getElementById('list-error').style.display = 'block';
});
</script>
<script src="/admin/js/adminNav.js"></script>
<script>initAdminNav('ops-history');</script>
</body>
</html>
