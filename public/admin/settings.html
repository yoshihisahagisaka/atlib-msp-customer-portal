<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>設定 | atLIB Admin</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<nav class="app-nav" id="admin-nav"></nav>

<div class="page" style="max-width:700px;">
  <h1>設定</h1>
  <p class="info-message">ここで変更した値はすぐに反映されます（アプリの再デプロイは不要）。空欄のまま保存すると、環境変数のデフォルト値に戻ります。</p>

  <div id="list-error" class="error-message" style="display:none;"></div>
  <div id="list-loading" class="info-message">読み込み中...</div>
  <div id="settings-list" style="display:none;"></div>

  <div class="card">
    <h2>管理者アクセス</h2>
    <p class="info-message">
      atlib.jpのGoogle Workspaceアカウントは誰でも一般権限でログインできます。ここに登録した個人メールアドレス、
      またはGoogleグループ（グループのメンバー全員が対象）は管理者権限になります。
    </p>
    <div id="principals-error" class="error-message" style="display:none;"></div>
    <div id="principals-loading" class="info-message">読み込み中...</div>
    <table id="principals-table" style="display:none;">
      <thead>
        <tr>
          <th>種別</th>
          <th>メールアドレス</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="principals-body"></tbody>
    </table>

    <form id="principal-form" style="margin-top:1rem;">
      <div class="radio-group form-row">
        <label><input type="radio" name="principal-type" value="email" checked> 個人メール</label>
        <label><input type="radio" name="principal-type" value="group"> Googleグループ</label>
      </div>
      <div class="form-row">
        <input type="email" id="principal-value" required placeholder="例: yoshihisa.hagisaka@atlib.jp または director@atlib.jp">
      </div>
      <div id="principal-form-error" class="error-message" style="display:none;"></div>
      <button type="submit" class="btn btn-small">追加</button>
    </form>
  </div>
</div>

<script>
async function loadSettings() {
  const errorEl = document.getElementById('list-error');
  const loadingEl = document.getElementById('list-loading');
  const listEl = document.getElementById('settings-list');
  errorEl.style.display = 'none';

  try {
    const res = await fetch('/api/admin/settings', { credentials: 'include' });
    if (!res.ok) throw new Error('failed to load');
    const data = await res.json();

    listEl.innerHTML = data.items.map((item) => `
      <div class="card" data-key="${item.key}">
        <h2>${item.label}</h2>
        <p class="info-message">${item.helpText}</p>
        <div class="form-row">
          <input type="text" class="setting-value" value="${escapeAttr(item.value)}">
        </div>
        <div class="setting-error error-message" style="display:none;"></div>
        <div class="setting-success success-message" style="display:none;"></div>
        <button type="button" class="btn btn-small setting-save">保存</button>
        <span class="info-message setting-default" style="display:${item.isDefault ? 'inline' : 'none'};margin-left:0.5rem;">（現在: 環境変数のデフォルト値）</span>
      </div>
    `).join('');

    listEl.querySelectorAll('.setting-save').forEach((btn) => {
      btn.addEventListener('click', () => saveSetting(btn.closest('.card')));
    });

    loadingEl.style.display = 'none';
    listEl.style.display = 'block';
  } catch {
    loadingEl.style.display = 'none';
    errorEl.textContent = '設定の取得に失敗しました。ページを再読み込みしてください。';
    errorEl.style.display = 'block';
  }
}

function escapeAttr(value) {
  return String(value).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

async function saveSetting(card) {
  const key = card.dataset.key;
  const input = card.querySelector('.setting-value');
  const errorEl = card.querySelector('.setting-error');
  const successEl = card.querySelector('.setting-success');
  const defaultEl = card.querySelector('.setting-default');
  const btn = card.querySelector('.setting-save');

  errorEl.style.display = 'none';
  successEl.style.display = 'none';
  btn.disabled = true;

  try {
    const res = await fetch(`/api/admin/settings/${encodeURIComponent(key)}`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'include',
      body: JSON.stringify({ value: input.value }),
    });
    if (!res.ok) {
      const data = await res.json().catch(() => ({}));
      throw new Error(data.error || '保存に失敗しました');
    }
    successEl.textContent = '保存しました。';
    successEl.style.display = 'block';
    defaultEl.style.display = 'none';
  } catch (err) {
    errorEl.textContent = err.message || '保存に失敗しました';
    errorEl.style.display = 'block';
  } finally {
    btn.disabled = false;
  }
}

async function loadPrincipals() {
  const errorEl = document.getElementById('principals-error');
  const loadingEl = document.getElementById('principals-loading');
  const table = document.getElementById('principals-table');
  const tbody = document.getElementById('principals-body');
  errorEl.style.display = 'none';

  try {
    const res = await fetch('/api/admin/admin-principals', { credentials: 'include' });
    if (!res.ok) throw new Error('failed to load');
    const data = await res.json();

    tbody.innerHTML = data.items.map((p) => `
      <tr>
        <td>${p.principalType === 'group' ? '<span class="badge badge-enabled">グループ</span>' : '<span class="badge badge-disabled">個人</span>'}</td>
        <td>${escapeAttr(p.value)}</td>
        <td><button type="button" class="btn btn-small btn-danger principal-remove" data-id="${p.id}">削除</button></td>
      </tr>
    `).join('');

    tbody.querySelectorAll('.principal-remove').forEach((btn) => {
      btn.addEventListener('click', () => removePrincipal(btn.dataset.id));
    });

    loadingEl.style.display = 'none';
    table.style.display = 'table';
  } catch {
    loadingEl.style.display = 'none';
    errorEl.textContent = '管理者一覧の取得に失敗しました。ページを再読み込みしてください。';
    errorEl.style.display = 'block';
  }
}

async function removePrincipal(id) {
  if (!confirm('このプリンシパルを削除しますか？')) return;
  try {
    const res = await fetch(`/api/admin/admin-principals/${encodeURIComponent(id)}`, {
      method: 'DELETE',
      credentials: 'include',
    });
    if (!res.ok) {
      const data = await res.json().catch(() => ({}));
      throw new Error(data.error || '削除に失敗しました');
    }
    await loadPrincipals();
  } catch (err) {
    alert(err.message || '削除に失敗しました');
  }
}

document.getElementById('principal-form').addEventListener('submit', async (ev) => {
  ev.preventDefault();
  const errorEl = document.getElementById('principal-form-error');
  errorEl.style.display = 'none';

  const type = document.querySelector('input[name="principal-type"]:checked').value;
  const value = document.getElementById('principal-value').value;

  try {
    const res = await fetch('/api/admin/admin-principals', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'include',
      body: JSON.stringify({ type, value }),
    });
    if (!res.ok) {
      const data = await res.json().catch(() => ({}));
      throw new Error(data.error || '追加に失敗しました');
    }
    document.getElementById('principal-form').reset();
    await loadPrincipals();
  } catch (err) {
    errorEl.textContent = err.message || '追加に失敗しました';
    errorEl.style.display = 'block';
  }
});

loadSettings();
loadPrincipals();
</script>
<script src="/admin/js/adminNav.js"></script>
<script>initAdminNav('settings');</script>
</body>
</html>
